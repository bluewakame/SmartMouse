name: Receiver release

# Windows PC を用意しなくても、GitHub 上で exe を作って配布できるようにする。
# - タグ v* を push すると Release を作り、ZIP を添付する
# - 手動実行（workflow_dispatch）ではビルド成果物だけを Artifacts に残す
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "公開するタグ（例: v0.5.0）。空ならビルドのみ行い、Artifactsに残す。"
        required: false
        type: string

permissions:
  contents: write
  # ビルドの出所を GitHub に証明させる（配布物が改ざんされていないことの根拠になる）。
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: WindowsReceiver

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: WindowsReceiver/requirements-build.txt

      - name: 依存関係を入れる
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: 通信仕様のテスト
        run: python -m unittest discover -s tests -v

      - name: 同梱するWebアプリがあるか確認
        shell: pwsh
        run: |
          if (-not (Test-Path "web/index.html")) {
            throw "web/index.html がありません。SmartMouse-WEB をビルドして web/ に入れてください。"
          }

      - name: バージョンを読む
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path main.py -Pattern '^APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

      # GPLのパッケージが同梱対象に入っているとビルドを止める。
      # 依存を足した人がライセンス条件の変化に気付けるようにする。
      - name: 同梱ライセンスの一覧を作る
        run: python generate_notices.py THIRD-PARTY-NOTICES.txt

      - name: exeをビルドする（onedir・UPXなし）
        run: python -m PyInstaller --noconfirm --clean SmartMouseReceiver.spec

      - name: 起動に必要なものが揃っているか確認
        shell: pwsh
        run: |
          foreach ($path in @(
            "dist/SmartMouseReceiver/SmartMouseReceiver.exe",
            "dist/SmartMouseReceiver/_internal",
            "dist/SmartMouseReceiver/_internal/web/index.html",
            "THIRD-PARTY-NOTICES.txt"
          )) {
            if (-not (Test-Path $path)) { throw "$path が生成されていません。" }
          }

      - name: ZIPにまとめる
        shell: pwsh
        run: |
          $name = "SmartMouseReceiver-v${{ steps.version.outputs.version }}"
          Copy-Item README-release-ja.txt "dist/SmartMouseReceiver/はじめにお読みください.txt"
          Copy-Item ../LICENSE "dist/SmartMouseReceiver/LICENSE.txt"
          Copy-Item THIRD-PARTY-NOTICES.txt "dist/SmartMouseReceiver/THIRD-PARTY-NOTICES.txt"
          # フォルダごと固める。exe単体では起動しないため、_internal と同じ階層を保つ。
          Compress-Archive -Path "dist/SmartMouseReceiver" -DestinationPath "dist/$name.zip" -Force
          "ZIP_PATH=WindowsReceiver/dist/$name.zip" >> $env:GITHUB_ENV

      # provenance はプランやリポジトリの公開設定によっては使えない。
      # 付けられない場合でも配布物は出せるようにする。
      - uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: ${{ env.ZIP_PATH }}

      - uses: actions/upload-artifact@v4
        with:
          name: SmartMouseReceiver-v${{ steps.version.outputs.version }}
          path: ${{ env.ZIP_PATH }}

      - name: Release へ公開する
        # タグをpushした場合と、手動実行でタグ名を指定した場合の両方に対応する。
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE $env:ZIP_PATH
          $notes = Join-Path $env:GITHUB_WORKSPACE ".github/release-notes-receiver.md"
          # すでに同名のReleaseがある場合（GitHubのUIで先に作った場合など）は、成果物だけ差し替える。
          gh release view $env:TAG --repo "${{ github.repository }}" 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG $zip --repo "${{ github.repository }}" --target $env:GITHUB_SHA --title "SmartMouse Receiver $env:TAG" --notes-file $notes
          } else {
            gh release upload $env:TAG $zip --repo "${{ github.repository }}" --clobber
          }
